<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>流動成風</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  :root{ --bg:#35544A; --fg:#FAF7F0; --accent:#2E86AB; --bright:#5BB8E8; --strip:#FAF7F0; }
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--fg); font-family:"Microsoft JhengHei","微軟正黑體",system-ui,sans-serif; }
  #root{ position:relative; width:100%; height:100%; overflow:hidden; }
  .clip{ position:absolute; inset:0; }

  /* 標題 */
  #title{ position:absolute; left:0; right:0; top:60px; text-align:center; font-size:96px; font-weight:800; margin:0; letter-spacing:.06em; }
  #subtitle{ position:absolute; left:0; right:0; top:200px; text-align:center; font-size:40px; color:var(--bright); margin:0; }

  /* 紙條區 */
  #stripZone{ position:absolute; left:180px; top:300px; width:640px; height:560px; }
  #pole{ position:absolute; left:80px; top:40px; width:14px; height:470px; background:var(--fg); border-radius:7px; }
  #strip{ position:absolute; left:80px; top:60px; width:60px; height:430px; background:var(--strip); border-radius:8px; transform-origin:50% 0%; }
  #strip .band{ position:absolute; left:0; right:0; height:3px; background:var(--accent); }
  #strip .band.b1{ top:80px; } #strip .band.b2{ top:200px; } #strip .band.b3{ top:320px; }

  /* 風力標籤與箭頭 */
  #windLabel{ position:absolute; right:100px; top:300px; width:640px; text-align:center; font-size:88px; font-weight:800; color:var(--bright); }
  #windArrows{ position:absolute; right:140px; top:470px; width:560px; text-align:center; font-size:90px; letter-spacing:.2em; white-space:nowrap; }

  /* 因果尺 */
  #causal{ position:absolute; left:180px; right:180px; bottom:300px; text-align:center; }
  #causalBar{ position:relative; height:36px; background:rgba(250,247,240,.18); border-radius:18px; margin:0 140px; }
  #causalFill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--bright); border-radius:18px; }
  #causalTxt{ margin-top:24px; font-size:44px; color:var(--fg); }
  #causalTxt b{ color:var(--bright); font-weight:800; }

  /* 結論 */
  #conclusion{ position:absolute; left:0; right:0; bottom:120px; text-align:center; font-size:92px; font-weight:800; color:var(--fg); margin:0; }
  #conclusion b{ color:var(--bright); }
</style>
</head>
<body>
<div id="root" data-composition-id="wind" data-start="0" data-width="1920" data-height="1080" data-duration="18">

  <section class="clip" data-start="0" data-duration="18">
    <h1 id="title">流動成風</h1>
    <p id="subtitle">空氣流動的快慢，決定風力強弱</p>
  </section>

  <section class="clip" data-start="2" data-duration="10">
    <div id="stripZone">
      <div id="pole"></div>
      <div id="strip"><div class="band b1"></div><div class="band b2"></div><div class="band b3"></div></div>
    </div>
    <div id="windLabel">無風</div>
    <div id="windArrows">💨</div>
  </section>

  <section class="clip" data-start="8" data-duration="6">
    <div id="causal">
      <div id="causalBar"><div id="causalFill"></div></div>
      <div id="causalTxt">流動越快　→　<b>風力越強</b></div>
    </div>
  </section>

  <section class="clip" data-start="13" data-duration="5">
    <p id="conclusion">流動越快，<b>風力越強</b></p>
  </section>

</div>
<script>
  const tl = gsap.timeline({ paused: true });

  // 0-2s 標題
  tl.from("#title", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2);
  tl.from("#subtitle", { opacity: 0, duration: 0.6, ease: "power2.out" }, 0.6);

  // 2-4s 無風：紙條不動，箭頭消失
  tl.set("#windArrows", { opacity: 0 }, 2);
  tl.set("#windLabel", { text: "無風" }, 2);

  // 4-6s 微風：紙條輕微搖擺，一根箭頭
  tl.set("#windLabel", { text: "微風" }, 4);
  tl.fromTo("#windArrows", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4);
  tl.to("#strip", { rotation: 8, duration: 0.4, ease: "sine.inOut" }, 4.2);
  tl.to("#strip", { rotation: -6, duration: 0.45, ease: "sine.inOut" }, 4.65);
  tl.to("#strip", { rotation: 5, duration: 0.4, ease: "sine.inOut" }, 5.1);
  tl.to("#strip", { rotation: 0, duration: 0.4, ease: "sine.inOut" }, 5.5);

  // 6-8s 強風：紙條大幅搖擺，三根箭頭
  tl.set("#windLabel", { text: "強風" }, 6);
  tl.to("#windArrows", { text: "💨💨💨", duration: 0.2 }, 6);
  tl.to("#strip", { rotation: 26, duration: 0.25, ease: "sine.inOut" }, 6.2);
  tl.to("#strip", { rotation: -22, duration: 0.25, ease: "sine.inOut" }, 6.5);
  tl.to("#strip", { rotation: 20, duration: 0.25, ease: "sine.inOut" }, 6.8);
  tl.to("#strip", { rotation: -18, duration: 0.25, ease: "sine.inOut" }, 7.1);
  tl.to("#strip", { rotation: 10, duration: 0.3, ease: "sine.inOut" }, 7.4);
  tl.to("#strip", { rotation: 0, duration: 0.3, ease: "sine.inOut" }, 7.7);

  // 8-12s 因果尺：從慢到快填滿
  tl.from("#causalFill", { width: "0%", duration: 3.2, ease: "power2.inOut" }, 8.4);
  tl.from("#causalTxt", { opacity: 0, y: 20, duration: 0.5 }, 8.4);

  // 13-18s 結論（最後停住 = 封面）
  tl.from("#conclusion", { opacity: 0, scale: 0.92, duration: 0.6, ease: "power3.out" }, 13.2);

  window.__timelines["wind"] = tl;
</script>
</body>
</html>
